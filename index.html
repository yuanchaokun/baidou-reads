        .book-wrapper {
            position: relative;
            aspect-ratio: 2/3;
        }

        .book {
            width: 100%;

            position: relative;
            transition: all 0.3s ease;
            background: #1a1a1a;

        }

        .book a {
            display: block;

            height: 100%;
        }

        }

        }

        .book-wrapper:hover .tooltip {

            top: 50%;

            padding: 15px;

            transform: translate(0, -50%);

            content: '';

            left: -10px;
            top: 50%;

            border-style: solid;
            border-color: transparent rgba(0, 0, 0, 0.95) transparent transparent;

    <script>
        let loadedImages = 0;
        let totalImages = 0;
        const BATCH_SIZE = 20;
        let currentBatch = 0;
        let isLoading = false;

        const bookGrid = document.getElementById('bookGrid');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');

        function updateProgress() {
            const progress = (loadedImages / totalImages) * 100;
            progressBar.style.width = `${progress}%`;
            loadingText.textContent = `已加载 ${loadedImages} / ${totalImages} 本书`;
        }

        function createBookElement(bookData, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'book-wrapper';
            
            const book = document.createElement('div');
            book.className = 'book';
            
            const link = document.createElement('a');
            link.href = bookData.doubanUrl;
            link.target = "_blank";
            
            const img = document.createElement('img');
            img.alt = bookData.title;
            
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.innerHTML = `
                <div class="tooltip-title">${bookData.title}</div>
                <div class="tooltip-date">${bookData.readDate}</div>
                ${bookData.review ? `<div class="tooltip-review">${bookData.review}</div>` : ''}
            `;

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        img.src = bookData.imageUrl;
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                rootMargin: '50px'
            });

            img.onload = () => {
                img.classList.add('loaded');
                loadedImages++;
                updateProgress();
                
                if (loadedImages === totalImages) {
                    loadingText.style.display = 'none';
                    progressBar.style.display = 'none';
                }
            };

            img.onerror = () => {
                loadedImages++;
                updateProgress();
                wrapper.style.display = 'none';
            };

            link.appendChild(img);
            book.appendChild(link);
            wrapper.appendChild(book);
            wrapper.appendChild(tooltip);
            
            observer.observe(wrapper);
            return wrapper;
        }

        function loadBatch(booksData, startIndex) {
            if (isLoading || startIndex >= booksData.length) return;
            
            isLoading = true;
            const fragment = document.createDocumentFragment();
            const endIndex = Math.min(startIndex + BATCH_SIZE, booksData.length);
            
            for (let i = startIndex; i < endIndex; i++) {
                const book = createBookElement(booksData[i], i);
                fragment.appendChild(book);
            }
            
            bookGrid.appendChild(fragment);
            currentBatch = endIndex;
            isLoading = false;

            if (endIndex < booksData.length) {
                requestIdleCallback(() => {
                    loadBatch(booksData, endIndex);
                }, { timeout: 1000 });
            }
        }

        function initializeGallery(booksData) {
            totalImages = booksData.length;
            loadBatch(booksData, 0);

            const scrollHandler = () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                    loadBatch(booksData, currentBatch);
                }
            };

            window.addEventListener('scroll', scrollHandler);
        }

            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.setAttribute('data-fullscreen', 'false');
                }
            }
        }

            if (!document.fullscreenElement) {

        review: "朋友送的，最近睡前都在读《理解漫画》这种用漫画来介绍漫画这种媒介的书，对漫画的感觉更好了。\n\n触动：\n\n1. 漫画有时候比文字更直接触动人。这本中好几页场景不同，时间不同，不变的是女主 之一藤野在桌前俯首画画的背景，震颤的感觉，穿越时间的专注努力，没有文字，两页就能能体现出来，当然有整本漫画作为大的语境场景在。\n\n2. 关注、反馈和专注能够带来巨大的改变。开始理解《NEVER Split the difference》中说的「倾听」是一种巨大的主动。京本的关注，藤野改变的契机。\n\n3. 雨中跳舞太酷了。多年前我是跑步。"

    {
        imageUrl: "https://cdn.jsdelivr.net/gh/yuanchaokun/douban-images@main/images/s34735442.jpg",

        title: "阿勒泰的角落",
        readDate: "2024-06-29\n      读过",
        review: "从老板那儿借的书。很久没读这种散文式的书了，整体感受很舒服。\n\n不只是文字影响阅读感受：纸质书、质感封面、内页页脚有趣的斜线、影视剧火了周围大家都在聊的环境氛围。\n\n上面这些都能够给人带来不一样的体验。\n\n体验影响感觉，感觉影响情绪，情绪影响思维、行动。\n\n所以我在想，阅读书籍也可以利用这种来给自己刻意设计，如果都是直接电子书下载，除非文字特别触动，影响自己才深一些。\n\n读一个作者的书籍内容花费 50 块，同样的内容现场听 ta 的演讲可能需要 300 块，一对一让 ta 亲自告诉你，有人可能出上千上万块。\n\n之前不理解，觉得是割韭菜，实际「场景触动」带来的改变确实不一样。\n\n启发：\n\n1. 电子书读完觉得不错的，买纸质书再读一遍\n2. 根据书内容换特定的场景，仪式感\n3. 穿特定主题的衣服"
    },
    {

        title: "史玉柱自述",
        readDate: "2024-06-28\n      读过",
        review: "偶然在城市图书馆馆内的电脑上看到这本，光头+没系扣子的Polo衫相比其他传记作者的封面，很突出。\n\n写随记的时候才发现是口述，语言平实，Leap into mind ，读来不拗口的方式就是文字说给朋友听也很正常。\n\n大概讲了脑白金的营销，《征途》游戏的策划设计，自己的人生感悟，值得一读。\n\n1、能卖出产品、能被记住的广告才是好广告。\n2、间歇性打广告的方式能省钱，效果还不错——很像记忆的 Anki SRS\n3、游戏是策划驱动，保健品是营销驱动，作为老板，不同的公司要抓不同的部分-史在保健品的时候写很多广告文案、在游戏公司的时候天天泡在游戏里体验细节。\n4、搞巨人大厦烂尾，重启保健品事业借 50 万在一个县级市打广告，爆了就拿赚来的钱继续扩大投广告，很像交易的浮盈加仓。\n5、史行动力很强。"

        title: "科学迷宫里的顽童与大师",
        readDate: "2024-06-23\n      读过",
        review: "朋友推荐阳志平老师的《工作的心智》- 顺道把阳志平所有的书都过了一遍，一个思路非常值得学习：把古今中外大师的思维模型放到一起进行厮杀，学习剩下来的。\n\n西蒙就是阳志平老师筛选后的学习对象，一个跨学科多成就的科学家，经济学、人工智能、计算机、认知心理学领域都获得了很高的成就。\n\n除了智商、时运等不可复制的因素外，那他的方法论就是想要达成类似的成就的「捷径」。「在方法论而不是结果上和最优秀的人进行对比」。\n\n读完西蒙的自传，发现他非常善于构建自己身边的环境，和其他人打交道的能力很强。「我阅读经典，认识了怀特海德和罗素...我和克劳德香农一起研究转换电路」\n\n对自己的了解很足，凭借着兴趣探索世界。\n\n他喜欢户外、旅行，竟然还多次来访中国。"

    {
        imageUrl: "https://cdn.jsdelivr.net/gh/yuanchaokun/douban-images@main/images/s33733115.jpg",

        title: "非线性成长",
        readDate: "2024-06-28\n      读过",
        review: "三星半。总体很有启发，值得推荐。这本书作者高中退学，后续靠自己的努力和时运职业发展都很好，写了互联网运营的《运营之光》，「三节课」职业在线教育的创始人。\n\n商业启发：成为某个领域的顶级的专家、或是成为商业操盘手。成为商业操盘手在合适的时机通过自己对整个商业模式的理解，成为「杠杆」，尽可能带来更多利润和收益。\n\n思考启发：人的发展往往是非线性的，在下一个成长曲线开始之前，至少要让基础的技能类很精通，然后思考如何切换领域，找到新的成长曲线，耐住回折。\n\n其他思考：特地去看了下三节课的网站，搜了下作者的相关报道，作者在几年前已经离开了三节课，三节课定位也变了。在作者书中描述的三节课叠上了滤镜，甚至是美化。\n\n值得学习作者的认真和非线性的思路，其他内容有些过时。"
    },

        readDate: "2024-06-28\n      读过",
        review: "睡前读物。断断续续读了一周，这本开始有些助眠的效果了。\n\n不剧透，记录些感受。\n\n想起最开始高中读小说的时候，被村上的《天黑之后》其中一个章节的描写震撼到，他是把房间中的一个点当做视角，甚至可以来回移动，对于当时只读过课本第一人称、第三人称视角的我来说，太神奇了，像科幻片。\n\n这本中的每隔几个章节就有人偶视角的讲述，很有趣。\n\n同样的写作方法在《周四推理俱乐部》（第几部忘了）也有，不过是把其中一个成员，应该是护士，她的日记直接当做章节内容放到其中了，很好玩。不同的视角。\n\n有种看书像打游戏。"

        title: "假面游戏",
        readDate: "2024-06-23\n      读过",
        review: "睡前读物。今年5月份开始逐渐突破把电子设备带到卧室的自定规则。\n\n发现主要原因有：加班多疲惫+朋友送的纸质书小说读完了。于是下单了些娱乐性纸质书，作为转换到睡眠状态的介质，不过发现日本的小说名字没有《周四推理俱乐部》小说中人名那么复杂催眠，睡意催生速度有些慢。\n\n不剧透说回这本书：\n\n小说是用文字在自己的脑海中构建画面、构建故事。如果书中没有提到更多信息，我就会按照自己的默认理解，载入脑中的画面，默认是日剧中最常出现的春天天气不错的日子。神奇的是，书中下一页提到了时间是在冬季，这时候脑中的画面直接「加载」了冬天的画面，像是叠上了一层滤镜，很神奇。\n\n联想到：人对世界的认识、对自己经历的认识，在通过阅读或对话获得一个看待世界新方式的时候，之前的一切都会叠上一层「智能角度滤镜」，神奇。"
